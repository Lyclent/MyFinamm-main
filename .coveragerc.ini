# .coveragerc
[run]
omit = 
    */tests/*
    */migrations/*
    */admin.py
    */apps.py
    manage.py
    */asgi.py
    */wsgi.py
    */__init__.py
    */settings.py
    */urls.py

[report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False: