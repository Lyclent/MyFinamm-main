[pytest]
DJANGO_SETTINGS_MODULE = MyFinam.settings
python_files = test_*.py *_test.py tests.py
testpaths = .
pythonpath = .

addopts = 
    -v
    --strict-markers
    --tb=short
    --nomigrations
    -p no:xdist
    --ignore=subscriptions/tests.py
    --ignore=transactions/tests.py

markers =
    slow: marks tests as slow
    integration: marks tests as integration tests